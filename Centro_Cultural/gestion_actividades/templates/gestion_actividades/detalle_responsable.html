{% extends 'gestion_actividades/base.html' %}

{% block titulo %}Detalle Responsable{% endblock %}

{% block contenido %}
    <h1>{{ responsable.nombre }}</h1>
    <p><strong>Teléfono:</strong> {{ responsable.telefono }}</p>
    <p><strong>Email:</strong> {{ responsable.email }}</p>

    <div class="acciones">
        <a href="{% url 'editar_responsable' responsable.id %}">Editar</a>
        <a href="{% url 'eliminar_responsable' responsable.id %}">Eliminar</a>
    </div>

    <a class="volver" href="{% url 'lista_responsables' %}">Volver al listado</a>
{% endblock %}
