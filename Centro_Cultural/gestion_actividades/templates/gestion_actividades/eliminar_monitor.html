{% extends 'gestion_actividades/base.html' %}

{% block titulo %}Eliminar monitor{% endblock %}

{% block contenido %}
    <h1>Eliminar monitor</h1>

    <p class="mensaje-eliminar">¿Estás seguro de que quieres eliminar al monitor "{{ monitor.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <a class="volver" href="{% url 'detalle_monitor' monitor.id %}">Cancelar</a>
{% endblock %}
