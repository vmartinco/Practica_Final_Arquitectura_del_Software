{% extends 'gestion_actividades/base.html' %}

{% block titulo %}Eliminar usuario{% endblock %}

{% block contenido %}
    <h1>Eliminar usuario</h1>

    <p class="mensaje-eliminar">¿Estás seguro de que quieres eliminar al usuario "{{ usuario.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-rojo">Sí, eliminar</button>
    </form>

    <a href="{% url 'detalle_usuario' usuario.id %}" class="btn btn-volver">Cancelar</a>
{% endblock %}
