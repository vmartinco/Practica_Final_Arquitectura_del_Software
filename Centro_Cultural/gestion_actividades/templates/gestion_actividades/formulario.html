<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'gestion_actividades/styles.css' %}">
</head>
<body>
    <div class="contenedor">
        <h1>{{ titulo }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

        </form>

        <a class="volver" href="{% url 'lista_actividades' %}">Volver al listado</a>
    </div>
</body>
</html>
