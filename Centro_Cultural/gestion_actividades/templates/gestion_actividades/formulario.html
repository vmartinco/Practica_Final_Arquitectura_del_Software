{% extends 'gestion_actividades/base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
    <h1>{{ titulo }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="acciones-form">
            <button type="submit" class="btn">Guardar</button>
            <a href="{{ url_volver }}" class="btn btn-volver">Cancelar</a>
        </div>
    </form>
{% endblock %}
