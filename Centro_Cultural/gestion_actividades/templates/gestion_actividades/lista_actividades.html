{% extends 'gestion_actividades/base.html' %}

{% block titulo %}Lista de actividades{% endblock %}

{% block contenido %}
    <h1>Actividades del centro cultural</h1>

    <a href="{% url 'nueva_actividad' %}">Crear nueva actividad</a>

    <form method="get" class="filtros">
        <input type="text" name="tipo" value="{{ tipo_actual|default:'' }}">

        <select name="monitor">
            <option value="">-- Todos los monitores --</option>
            {% for m in monitores %}
                <option value="{{ m.id }}" {% if m.id|stringformat:"s" == monitor_actual %}selected{% endif %}>
                    {{ m.nombre }}
                </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn">Filtrar</button>
        <a href="{% url 'lista_actividades' %}" class="limpiar">Limpiar filtros</a>
    </form>

    <ul>
        {% for actividad in actividades %}
            <li>
                <a href="{% url 'detalle_actividad' actividad.id %}">
                    {{ actividad.nombre }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
