{% extends 'gestion_actividades/base.html' %}

{% block titulo %}Lista de monitores{% endblock %}

{% block contenido %}
    <h1>Monitores</h1>

    <a href="{% url 'nuevo_monitor' %}">Crear nuevo monitor</a>

    <ul>
        {% for monitor in monitores %}
            <li>
                <a href="{% url 'detalle_monitor' monitor.id %}">
                    {{ monitor.nombre }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
