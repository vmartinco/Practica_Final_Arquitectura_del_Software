{% extends 'gestion_actividades/base.html' %}

{% block titulo %}Lista de usuarios{% endblock %}

{% block contenido %}
    <h1>Usuarios inscritos</h1>

    <a href="{% url 'nuevo_usuario' %}" class="btn btn-nuevo">Crear nuevo usuario</a>

    <form method="get" class="filtros" style="margin-top: 20px;">
        <label>Filtrar por actividad:</label>
        <select name="actividad">
            <option value="">-- Todas las actividades --</option>
            {% for a in actividades %}
                <option value="{{ a.id }}" {% if a.id|stringformat:"s" == actividad_actual %}selected{% endif %}>
                    {{ a.nombre }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Filtrar</button>
        <a href="{% url 'lista_usuarios' %}" class="limpiar">Ver todos</a>
    </form>

    <ul>
        {% for usuario in usuarios %}
            <li>
                <a href="{% url 'detalle_usuario' usuario.id %}">
                    {{ usuario.nombre }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
